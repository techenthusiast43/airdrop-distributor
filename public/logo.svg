<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#090d16" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#060911" stop-opacity="1"/>
    </radialGradient>

    <!-- Vibrant Primary Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Accent Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-opacity="0.35"/>

  <!-- Orbital Ring (Dashed High-Tech Matrix) -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="8 12"/>
  <circle cx="256" cy="256" r="115" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Dispersal Beams (Connecting Center to Recipient Nodes) -->
  <g stroke="url(#primaryGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#subtleGlow)">
    <!-- Top-Left Beam -->
    <line x1="256" y1="210" x2="135" y2="145"/>
    <!-- Top-Right Beam -->
    <line x1="256" y1="210" x2="377" y2="145"/>
    <!-- Far-Left Beam -->
    <line x1="210" y1="256" x2="100" y2="256"/>
    <!-- Far-Right Beam -->
    <line x1="302" y1="256" x2="412" y2="256"/>
    <!-- Bottom-Left Beam -->
    <line x1="230" y1="290" x2="155" y2="375"/>
    <!-- Bottom-Right Beam -->
    <line x1="282" y1="290" x2="357" y2="375"/>
  </g>

  <!-- Recipient Target Nodes -->
  <!-- Node 1 (Top Left) -->
  <circle cx="135" cy="145" r="14" fill="#0b0f19" stroke="#6366f1" stroke-width="3.5" filter="url(#subtleGlow)"/>
  <circle cx="135" cy="145" r="6" fill="#38bdf8"/>

  <!-- Node 2 (Top Right) -->
  <circle cx="377" cy="145" r="14" fill="#0b0f19" stroke="#38bdf8" stroke-width="3.5" filter="url(#subtleGlow)"/>
  <circle cx="377" cy="145" r="6" fill="#6366f1"/>

  <!-- Node 3 (Far Left) -->
  <circle cx="100" cy="256" r="16" fill="#0b0f19" stroke="#6366f1" stroke-width="4" filter="url(#subtleGlow)"/>
  <circle cx="100" cy="256" r="7" fill="#818cf8"/>

  <!-- Node 4 (Far Right) -->
  <circle cx="412" cy="256" r="16" fill="#0b0f19" stroke="#06b6d4" stroke-width="4" filter="url(#subtleGlow)"/>
  <circle cx="412" cy="256" r="7" fill="#10b981"/>

  <!-- Node 5 (Bottom Left) -->
  <circle cx="155" cy="375" r="15" fill="#0b0f19" stroke="#06b6d4" stroke-width="3.5" filter="url(#subtleGlow)"/>
  <circle cx="155" cy="375" r="6.5" fill="#38bdf8"/>

  <!-- Node 6 (Bottom Right) -->
  <circle cx="357" cy="375" r="15" fill="#0b0f19" stroke="#10b981" stroke-width="3.5" filter="url(#subtleGlow)"/>
  <circle cx="357" cy="375" r="6.5" fill="#34d399"/>

  <!-- Central Dispersal Core (Bohr Hexagon Crystal) -->
  <g filter="url(#neonGlow)">
    <!-- Outer Core Shield -->
    <polygon points="256,192 312,224 312,288 256,320 200,288 200,224" fill="url(#primaryGrad)" fill-opacity="0.95"/>
    <!-- Inner Core Inset -->
    <polygon points="256,204 300,229 300,283 256,308 212,283 212,229" fill="#090d16"/>
  </g>

  <!-- Glowing Parachute / Vector Arrow In Center (Symbolizing Airdrop Speed) -->
  <path d="M256,222 L278,252 L264,252 L264,286 L248,286 L248,252 L234,252 Z" 
        fill="url(#emeraldGrad)" 
        filter="url(#subtleGlow)"
        transform="rotate(180 256 254)"/>

  <!-- Dynamic Token Droplets Floating Inward/Outward -->
  <circle cx="218" cy="180" r="4.5" fill="#38bdf8" opacity="0.9"/>
  <circle cx="294" cy="180" r="4.5" fill="#818cf8" opacity="0.9"/>
  <circle cx="180" cy="275" r="4" fill="#6366f1" opacity="0.8"/>
  <circle cx="332" cy="275" r="4" fill="#10b981" opacity="0.8"/>
  <circle cx="256" cy="355" r="5" fill="#06b6d4" opacity="0.95"/>
</svg>
